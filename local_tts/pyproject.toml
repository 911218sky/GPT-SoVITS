[project]
name = "gpt-sovits-local-tools"
version = "0.1.0"
description = "Local launchers and API clients for GPT-SoVITS"
requires-python = ">=3.10,<3.11"
dependencies = [
    "fastapi==0.115.6",
    "requests>=2.31",
    "starlette==0.41.3",
    "tqdm>=4.66",
]

[tool.uv]
package = false

[tool.basedpyright]
typeCheckingMode = "all"
reportAny = "none"
reportUnknownVariableType = "none"
reportUnusedCallResult = "none"
